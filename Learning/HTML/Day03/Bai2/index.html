<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>table_learning</title>
  </head>
  <body>
    <table>

      <thead>
        <tr>
          <th>Món ăn</th>
          <th>Giá</th>
        </tr>
      </thead>

      <tbody>
        <tr>
          <td>Bánh mỳ</td>
          <td>30k</td>
        </tr>
        <tr>
          <td>Bún chả</td>
          <td>40k</td>
        </tr>
      </tbody>

      <tfoot>
        <tr>
          <td>Tổng</td>
          <td>70K</td>
        </tr>
      </tfoot>

    </table>
  </body>
</html>
